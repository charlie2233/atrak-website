# This workflow fetches your GitHub data and caches it as a JSON file
# Runs daily, after site pushes, or manually via workflow_dispatch
# Uses optional GH_PAT for higher read limits, then falls back to public data

name: Update GitHub Data

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
    - cron: '0 12 * * *' # Also at noon UTC for fresher data
  workflow_dispatch:  # Allows manual trigger from Actions tab
    inputs:
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'data/github-events.json'
      - 'data/github-meta.json'
      - 'data/github-releases.json'
      - 'data/github-repos.json'
      - 'data/github-weekly.json'
      - 'data/last-updated.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atrak-data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          API_BASE="https://api.github.com"
          USERNAME="charlie2233"

          AUTH_HEADER=()
          if [ -n "${GH_TOKEN:-}" ]; then
            if curl -fsSL \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_BASE}/user" >/dev/null 2>&1; then
              AUTH_HEADER=(-H "Authorization: token $GH_TOKEN")
              export GH_TOKEN
              echo "Using authenticated GitHub API requests."
            else
              unset GH_TOKEN
              echo "Configured GH token was rejected; using public GitHub API requests."
            fi
          else
            echo "No GH token configured; using unauthenticated GitHub API requests (lower rate limit)."
          fi

          # Fetch public repositories for the public site cache.
          REPO_URL="${API_BASE}/users/${USERNAME}/repos?sort=updated&per_page=100&type=owner"

          page=1
          while [ "$page" -le 10 ]; do
            url="${REPO_URL}&page=${page}"
            output="data/_repos_page_${page}.json"
            curl -fsSL "${AUTH_HEADER[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}" \
              > "${output}"
            count=$(python3 - <<'PY' "${output}"
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          print(len(data) if isinstance(data, list) else 0)
          PY
          )
            if [ "${count}" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          python3 - <<'PY'
          import json
          import glob
          from pathlib import Path

          raw = []
          for file_name in sorted(glob.glob("data/_repos_page_*.json")):
              path = Path(file_name)
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if isinstance(data, list):
                      raw.extend(data)
              finally:
                  path.unlink(missing_ok=True)

          repos = []
          seen = set()
          for repo in raw:
              if not isinstance(repo, dict):
                  continue
              owner = (repo.get("owner") or {}).get("login")
              full_name = repo.get("full_name") or ""
              if owner and owner.lower() != "charlie2233":
                  continue
              key = full_name.lower()
              if not key or key in seen:
                  continue
              seen.add(key)
              repos.append(repo)

          repos.sort(key=lambda r: r.get("updated_at") or "", reverse=True)
          Path("data/github-repos.json").write_text(json.dumps(repos, indent=2) + "\n", encoding="utf-8")
          PY

          # Fetch recent events (pushes, releases, etc.)
          for page in $(seq 1 10); do
            curl -fsSL "${AUTH_HEADER[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_BASE}/users/${USERNAME}/events/public?per_page=100&page=${page}" \
              > "data/_events_${page}.json" || echo "[]" > "data/_events_${page}.json"
            count=$(python3 - <<'PY' "data/_events_${page}.json"
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          print(len(data) if isinstance(data, list) else 0)
          PY
          )
            if [ "${count}" -lt 100 ]; then
              break
            fi
          done

          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          events = []
          for file_name in sorted(glob.glob("data/_events_*.json")):
              path = Path(file_name)
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if isinstance(data, list):
                      events.extend(data)
              except Exception:
                  pass
              try:
                  path.unlink()
              except Exception:
                  pass

          Path("data/github-events.json").write_text(json.dumps(events, indent=2) + "\n", encoding="utf-8")
          PY

          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repos = json.loads(Path("data/github-repos.json").read_text(encoding="utf-8"))
          if not isinstance(repos, list):
              raise SystemExit(f"Expected list response, got: {type(repos).__name__}: {repos}")

          # Calculate stats
          total_stars = sum(r.get("stargazers_count", 0) for r in repos)
          total_forks = sum(r.get("forks_count", 0) for r in repos)
          languages = set(r.get("language") for r in repos if r.get("language"))
          
          # Get most recent push
          most_recent = None
          for r in repos:
              if r.get("pushed_at"):
                  if most_recent is None or r["pushed_at"] > most_recent:
                      most_recent = r["pushed_at"]

          meta = {
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "repoCount": len(repos),
              "totalStars": total_stars,
              "totalForks": total_forks,
              "languageCount": len(languages),
              "mostRecentPush": most_recent,
              "source": "github-actions-cache",
          }

          Path("data/github-meta.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          Path("data/last-updated.txt").write_text(meta["updatedAt"] + "\n", encoding="utf-8")

          api_base = "https://api.github.com"
          token = os.environ.get("GH_TOKEN") or ""
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "atrak-dev-site",
          }
          if token:
              headers["Authorization"] = f"token {token}"

          def fetch_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          # Weekly stats (commit contributions, PRs, etc.). Prefer GraphQL when a
          # valid optional PAT exists; otherwise keep the weekly log alive from
          # public events plus public commits.
          events_path = Path("data/github-events.json")
          try:
              events = json.loads(events_path.read_text(encoding="utf-8"))
          except Exception:
              events = []
          if not isinstance(events, list):
              events = []

          now = datetime.datetime.utcnow().replace(microsecond=0)
          week_ago = now - datetime.timedelta(days=7)

          def parse_dt(value):
              if not value:
                  return None
              try:
                  return datetime.datetime.fromisoformat(str(value).replace("Z", "+00:00")).replace(tzinfo=None)
              except Exception:
                  return None

          recent_public_repos = []
          for repo in repos:
              if not isinstance(repo, dict) or repo.get("fork") or repo.get("archived"):
                  continue
              pushed = parse_dt(repo.get("pushed_at") or repo.get("updated_at"))
              if pushed and pushed >= week_ago:
                  recent_public_repos.append(repo)

          for repo in recent_public_repos:
              full_name = repo.get("full_name")
              if not full_name:
                  continue
              since = urllib.parse.quote(week_ago.isoformat() + "Z", safe="")
              until = urllib.parse.quote(now.isoformat() + "Z", safe="")
              try:
                  commits_response = fetch_json(f"{api_base}/repos/{full_name}/commits?since={since}&until={until}&per_page=100")
              except Exception as e:
                  print(f"Failed to enrich commits for {full_name}: {e}")
                  continue
              if not isinstance(commits_response, list):
                  continue
              commit_summaries = []
              for commit in commits_response[:20]:
                  if not isinstance(commit, dict):
                      continue
                  commit_summaries.append({
                      "sha": commit.get("sha") or "",
                      "message": ((commit.get("commit") or {}).get("message") or ""),
                      "url": commit.get("html_url") or "",
                  })
              count = len(commits_response)
              matching_push = None
              for event in events:
                  if not isinstance(event, dict) or event.get("type") != "PushEvent":
                      continue
                  event_repo = (event.get("repo") or {}).get("name")
                  event_date = parse_dt(event.get("created_at"))
                  if event_repo == full_name and event_date and event_date >= week_ago:
                      matching_push = event
                      break
              if matching_push is None and count:
                  matching_push = {
                      "type": "PushEvent",
                      "created_at": repo.get("pushed_at") or now.isoformat() + "Z",
                      "repo": {"name": full_name},
                      "payload": {
                          "ref": f"refs/heads/{repo.get('default_branch') or 'main'}",
                          "before": "",
                          "head": commit_summaries[0]["sha"] if commit_summaries else "",
                      },
                  }
                  events.insert(0, matching_push)
              if matching_push is not None:
                  payload = matching_push.setdefault("payload", {})
                  payload["distinct_size"] = count
                  payload["commits"] = commit_summaries

          events_path.write_text(json.dumps(events, indent=2) + "\n", encoding="utf-8")

          weekly_events = []
          for event in events:
              if not isinstance(event, dict):
                  continue
              event_date = parse_dt(event.get("created_at"))
              if event_date and week_ago <= event_date <= now:
                  weekly_events.append(event)

          active_repos = set()
          event_commits = 0
          event_prs = 0
          event_issues = 0
          for event in weekly_events:
              repo_name = (event.get("repo") or {}).get("name")
              if repo_name:
                  active_repos.add(repo_name)
              event_type = event.get("type")
              if event_type == "PushEvent":
                  payload = event.get("payload") or {}
                  event_commits += int(payload.get("distinct_size") or len(payload.get("commits") or []) or 0)
              elif event_type == "PullRequestEvent":
                  event_prs += 1
              elif event_type == "IssuesEvent":
                  event_issues += 1

          weekly_stats = {
              "updatedAt": meta["updatedAt"],
              "from": week_ago.isoformat() + "Z",
              "to": now.isoformat() + "Z",
              "totalCommitContributions": event_commits,
              "totalPullRequestContributions": event_prs,
              "totalIssueContributions": event_issues,
              "totalRepositoryContributions": len(active_repos),
              "source": "github-public-events",
          }

          if token:
              try:
                  query = """
                  query($login: String!, $from: DateTime!, $to: DateTime!) {
                    user(login: $login) {
                      contributionsCollection(from: $from, to: $to) {
                        totalCommitContributions
                        totalPullRequestContributions
                        totalIssueContributions
                        totalRepositoryContributions
                      }
                    }
                  }
                  """.strip()

                  payload = json.dumps({
                      "query": query,
                      "variables": {
                          "login": "charlie2233",
                          "from": week_ago.isoformat() + "Z",
                          "to": now.isoformat() + "Z",
                      }
                  }).encode("utf-8")

                  headers = {
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "atrak-dev-site",
                      "Authorization": f"token {token}",
                  }

                  req = urllib.request.Request("https://api.github.com/graphql", data=payload, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)

                  cc = (data or {}).get("data", {}).get("user", {}).get("contributionsCollection", {}) or {}
                  weekly_stats = {
                      "updatedAt": meta["updatedAt"],
                      "from": week_ago.isoformat() + "Z",
                      "to": now.isoformat() + "Z",
                      "totalCommitContributions": int(cc.get("totalCommitContributions") or 0),
                      "totalPullRequestContributions": int(cc.get("totalPullRequestContributions") or 0),
                      "totalIssueContributions": int(cc.get("totalIssueContributions") or 0),
                      "totalRepositoryContributions": int(cc.get("totalRepositoryContributions") or 0),
                      "source": "github-graphql",
                  }
              except Exception as e:
                  print(f"Failed to fetch weekly GraphQL stats: {e}")

          weekly_path = Path("data/github-weekly.json")
          try:
              existing_weekly = json.loads(weekly_path.read_text(encoding="utf-8"))
          except Exception:
              existing_weekly = {}
          if isinstance(existing_weekly, dict) and existing_weekly.get("source") == "local-git-refresh":
              print("Preserving local weekly stats; GitHub Actions cannot observe checked-out local repos.")
              weekly_stats = existing_weekly

          weekly_path.write_text(json.dumps(weekly_stats, indent=2) + "\n", encoding="utf-8")

          # Fetch recent releases across repos (for the website "Latest releases" UI)
          candidates = [
              r for r in repos
              if isinstance(r, dict) and r.get("full_name") and not r.get("fork")
          ]
          candidates.sort(key=lambda r: r.get("pushed_at") or "", reverse=True)

          releases = []
          for repo in candidates:
              full_name = repo.get("full_name")
              if not full_name:
                  continue
              try:
                  rels = fetch_json(f"{api_base}/repos/{full_name}/releases?per_page=5")
              except Exception as e:
                  print(f"Failed to fetch releases for {full_name}: {e}")
                  continue
              if not isinstance(rels, list):
                  continue
              for rel in rels:
                  if not isinstance(rel, dict):
                      continue
                  assets = []
                  for asset in rel.get("assets") or []:
                      if not isinstance(asset, dict):
                          continue
                      assets.append({
                          "name": asset.get("name") or "",
                          "download_url": asset.get("browser_download_url") or "",
                          "size": int(asset.get("size") or 0),
                          "download_count": int(asset.get("download_count") or 0),
                      })
                  releases.append({
                      "repo": full_name,
                      "name": rel.get("name") or "",
                      "tag": rel.get("tag_name") or "",
                      "url": rel.get("html_url") or "",
                      "published_at": rel.get("published_at") or "",
                      "draft": bool(rel.get("draft")),
                      "prerelease": bool(rel.get("prerelease")),
                      "zipball_url": rel.get("zipball_url") or "",
                      "tarball_url": rel.get("tarball_url") or "",
                      "assets": assets,
                  })

          releases.sort(key=lambda r: r.get("published_at") or "", reverse=True)
          Path("data/github-releases.json").write_text(json.dumps(releases, indent=2) + "\n", encoding="utf-8")

          print(f"Repos fetched: {len(repos)}")
          print(f"Total stars: {total_stars}")
          print(f"Languages: {len(languages)}")
          print(f"Updated at (UTC): {meta['updatedAt']}")
          print(f"Releases fetched: {len(releases)}")
          PY
      
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          did_push=false

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub data [skip ci]"
            git push
            did_push=true
          fi

          if [ "$did_push" = "true" ]; then
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
