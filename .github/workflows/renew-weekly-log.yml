name: Renew Weekly Log

on:
  schedule:
    - cron: '15 9 * * 0'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Optional Sunday to rebuild (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atrak-data-refresh
  cancel-in-progress: false

jobs:
  renew-weekly-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build completed weekly edition
        env:
          OPTIONAL_GH_PAT: ${{ secrets.GH_PAT }}
          REPOSITORY_TOKEN: ${{ github.token }}
          WEEK_START: ${{ inputs.week_start }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$REPOSITORY_TOKEN"
          if [ -n "${OPTIONAL_GH_PAT:-}" ] && curl -fsSL \
            -H "Authorization: Bearer ${OPTIONAL_GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user" >/dev/null 2>&1; then
            export GH_TOKEN="$OPTIONAL_GH_PAT"
            echo "Using the validated optional GitHub token."
          elif [ -n "${OPTIONAL_GH_PAT:-}" ]; then
            echo "The optional GitHub token was rejected; using the repository token."
          else
            echo "Using the repository token."
          fi
          args=(--github-api)
          if [ -n "${WEEK_START:-}" ]; then
            args+=(--week-start "$WEEK_START")
          fi
          node scripts/renew-weekly-log.mjs "${args[@]}"

      - name: Validate weekly archive
        run: |
          set -euo pipefail
          node --check scripts/renew-weekly-log.mjs
          node --check weekly-log.js
          jq -e '
            type == "array" and
            all(.[]; (.dateRange | type == "string") and (.title | type == "string")) and
            ([.[] | select(.source == "github-weekly-automation")] | length >= 1)
          ' data/weekly-history.json >/dev/null

      - name: Commit weekly edition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/weekly-history.json

          if git diff --staged --quiet; then
            echo "Weekly edition is already current."
            exit 0
          fi

          git commit -m "chore: renew weekly log [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
