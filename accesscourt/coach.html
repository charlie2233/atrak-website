<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visual Drill Coach is a no-login accessible basketball instruction tool built by Atrak for the AccessCourt pilot.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#f05a28">
  <title>Visual Drill Coach | AccessCourt</title>
  <link rel="canonical" href="https://atrak.dev/accesscourt/coach.html">
  <meta property="og:title" content="Visual Drill Coach | AccessCourt">
  <meta property="og:description" content="A no-login, multilingual basketball instruction MVP built by Atrak for the AccessCourt pilot.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atrak.dev/accesscourt/coach.html">
  <meta property="og:image" content="https://atrak.dev/accesscourt/assets/dribble-illustration.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Visual Drill Coach | AccessCourt">
  <meta name="twitter:description" content="A no-login, multilingual basketball instruction MVP built by Atrak for the AccessCourt pilot.">
  <meta name="twitter:image" content="https://atrak.dev/accesscourt/assets/dribble-illustration.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="coach.css">
  <script src="coach.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#coach-main">Skip to instruction</a>
  <header class="coach-header">
    <a class="coach-brand" href="index.html" aria-label="AccessCourt home">
      <span class="coach-ball" aria-hidden="true"></span>
      <span>Access<span>Court</span></span>
    </a>
    <strong>Visual Drill Coach</strong>
    <div class="coach-settings" aria-label="Coach settings">
      <label><span class="sr-only">Language</span><select id="language"><option value="en">English</option><option value="zh">中文</option><option value="es">Español</option></select></label>
      <button type="button" id="complexity" aria-pressed="true" aria-describedby="complexity-status">Simple instructions</button>
      <span id="complexity-status" class="sr-only" aria-live="polite">Simple instructions active</span>
      <button type="button" id="contrast" aria-pressed="false">High contrast</button>
      <a class="coach-back-link" href="index.html">Back to AccessCourt</a>
      <a class="coach-atrak-link" href="https://atrak.dev/" aria-label="Visit the Atrak student technology team">↗ Atrak</a>
    </div>
  </header>

  <main id="coach-main" class="coach-main" tabindex="-1">
    <section class="instruction" aria-live="polite" aria-atomic="true">
      <div class="instruction-copy">
        <p class="step-count" id="step-count">Step 1 of 6</p>
        <h1 id="step-title">Get ready</h1>
        <p class="step-instruction" id="step-instruction">Face forward. Keep your body balanced.</p>
      </div>
      <figure class="instruction-visual">
        <img src="assets/dribble-illustration.png" width="971" height="1619" alt="Line illustration of an athlete bouncing a basketball." id="step-image">
      </figure>
    </section>

    <div class="coach-actions" aria-label="Step controls">
      <button type="button" class="secondary" id="previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Previous
      </button>
      <button type="button" class="speak" id="speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Zm4 4a5 5 0 0 1 0 6m2.5-8.5a8 8 0 0 1 0 11"/></svg>
        Hear instruction
      </button>
      <button type="button" class="primary" id="next">
        Next
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <label class="seated-toggle">
      <span>Seated version</span>
      <input type="checkbox" id="seated">
      <span class="toggle-track" aria-hidden="true"></span>
    </label>

    <nav class="sequence" aria-label="Drill sequence">
      <ol id="sequence-list"></ol>
    </nav>
    <p class="privacy-note">No login. No participant accounts. No video, voice, diagnosis, or personal data is collected by this page.</p>
  </main>
</body>
</html>
